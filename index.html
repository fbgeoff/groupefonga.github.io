<body>
<div id="comingSoonOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 99999;
    background: linear-gradient(135deg, #0b3d91 0%, #1e5bb8 50%, #0a2c66 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
">
    <style>
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .cs-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .cs-shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }
        .cs-shape:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }
        .cs-shape:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation-delay: 5s;
        }
        .cs-shape:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 50%;
            right: 10%;
            animation-delay: 10s;
        }
        .cs-container {
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeIn 1.2s ease-in;
            color: #fff;
            padding: 20px;
        }
        .cs-logo {
            font-size: 52px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -2px;
            animation: pulse 3s ease-in-out infinite;
        }
        .cs-coming-soon {
            font-size: 64px;
            font-weight: 800;
            margin: 40px 0 20px;
            letter-spacing: -2px;
            background: linear-gradient(45deg, #fff, #a8d5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
        }
        .cs-tagline {
            font-size: 20px;
            margin-bottom: 50px;
            opacity: 0.95;
        }
        .cs-contact-mini {
            display: inline-flex;
            gap: 24px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 16px 32px;
            margin-top: 20px;
        }
        .cs-contact-mini a {
            color: #fff;
            text-decoration: none;
            font-size: 28px;
            transition: transform 0.3s ease;
            display: inline-block;
        }
        .cs-contact-mini a:hover {
            transform: scale(1.2) rotate(10deg);
        }
        @media (max-width: 600px) {
            .cs-logo { font-size: 36px; }
            .cs-coming-soon { font-size: 42px; }
            .cs-tagline { font-size: 16px; }
            .cs-contact-mini { gap: 16px; padding: 12px 24px; }
            .cs-contact-mini a { font-size: 24px; }
        }
    </style>
    
    <div class="cs-shapes">
        <div class="cs-shape"></div>
        <div class="cs-shape"></div>
        <div class="cs-shape"></div>
    </div>
    
    <div class="cs-container">
        <div class="cs-logo">Groupe Fonga LLC</div>
        <div class="cs-coming-soon">Coming Soon</div>
        <p class="cs-tagline">Something great is in the works</p>
        <div class="cs-contact-mini">
            <a href="mailto:info@groupefonga.com" title="Email us">📧</a>
            <a href="tel:+15127615585" title="Call us">📞</a>
        </div>
    </div>
</div>
