<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groupe Fonga LLC | Coming Soon</title>
<meta name="description" content="SBA 8(a) small business - Coming Soon">

<style>
* { 
    box-sizing: border-box; 
    margin: 0;
    padding: 0;
}

body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: #0a1128;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
}

/* Animated Grid Background */
.grid-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        linear-gradient(90deg, rgba(11, 61, 145, 0.1) 1px, transparent 1px),
        linear-gradient(rgba(11, 61, 145, 0.1) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 20s linear infinite;
    z-index: 0;
}

@keyframes gridMove {
    0% { transform: translate(0, 0); }
    100% { transform: translate(50px, 50px); }
}

/* Floating Particles */
.particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.particle {
    position: absolute;
    background: radial-gradient(circle, rgba(168, 213, 255, 0.8), transparent);
    border-radius: 50%;
    animation: particleFloat 15s infinite ease-in-out;
}

.particle:nth-child(1) {
    width: 4px;
    height: 4px;
    top: 20%;
    left: 10%;
    animation-delay: 0s;
    animation-duration: 12s;
}

.particle:nth-child(2) {
    width: 6px;
    height: 6px;
    top: 60%;
    left: 80%;
    animation-delay: 3s;
    animation-duration: 18s;
}

.particle:nth-child(3) {
    width: 3px;
    height: 3px;
    top: 40%;
    left: 30%;
    animation-delay: 6s;
    animation-duration: 15s;
}

.particle:nth-child(4) {
    width: 5px;
    height: 5px;
    top: 80%;
    left: 60%;
    animation-delay: 2s;
    animation-duration: 14s;
}

.particle:nth-child(5) {
    width: 4px;
    height: 4px;
    top: 15%;
    left: 70%;
    animation-delay: 8s;
    animation-duration: 16s;
}

@keyframes particleFloat {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    50% { transform: translate(100px, -100px) scale(1.5); }
}

/* Glowing Orbs */
.orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.3;
    animation: orbFloat 20s infinite ease-in-out;
}

.orb1 {
    width: 400px;
    height: 400px;
    background: #0b3d91;
    top: -200px;
    left: -200px;
    animation-delay: 0s;
}

.orb2 {
    width: 300px;
    height: 300px;
    background: #1e5bb8;
    bottom: -150px;
    right: -150px;
    animation-delay: 5s;
}

.orb3 {
    width: 250px;
    height: 250px;
    background: #0a2c66;
    top: 50%;
    left: 50%;
    animation-delay: 10s;
}

@keyframes orbFloat {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(50px, -50px); }
    66% { transform: translate(-30px, 30px); }
}

/* Main Content */
.container {
    max-width: 700px;
    text-align: center;
    position: relative;
    z-index: 10;
    animation: fadeInUp 1.5s ease-out;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(50px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Logo */
.logo {
    font-size: 56px;
    font-weight: 900;
    margin-bottom: 10px;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #fff 0%, #a8d5ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 40px rgba(168, 213, 255, 0.3);
}

/* Badge */
.badge {
    display: inline-block;
    background: rgba(11, 61, 145, 0.3);
    border: 2px solid rgba(168, 213, 255, 0.3);
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 30px;
    animation: badgePulse 3s ease-in-out infinite;
}

@keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 20px rgba(168, 213, 255, 0.2); }
    50% { box-shadow: 0 0 40px rgba(168, 213, 255, 0.4); }
}

/* Coming Soon Text */
.coming-soon {
    font-size: 72px;
    font-weight: 900;
    margin: 30px 0;
    letter-spacing: -3px;
    background: linear-gradient(45deg, #fff, #a8d5ff, #fff);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientSlide 4s ease infinite;
    text-shadow: 0 0 60px rgba(168, 213, 255, 0.5);
}

@keyframes gradientSlide {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* Tagline */
.tagline {
    font-size: 22px;
    margin-bottom: 50px;
    opacity: 0.9;
    font-weight: 400;
    letter-spacing: 0.5px;
}

/* Contact Section */
.contact-box {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 30px;
    margin-top: 40px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.contact-title {
    font-size: 18px;
    margin-bottom: 20px;
    opacity: 0.8;
    font-weight: 500;
}

.contact-links {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}

.contact-link {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    font-weight: 600;
    padding: 14px 28px;
    background: rgba(11, 61, 145, 0.4);
    border: 1px solid rgba(168, 213, 255, 0.3);
    border-radius: 50px;
    transition: all 0.3s ease;
}

.contact-link:hover {
    background: rgba(11, 61, 145, 0.6);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(11, 61, 145, 0.4);
}

.contact-icon {
    font-size: 24px;
    animation: iconBounce 2s ease-in-out infinite;
}

@keyframes iconBounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

/* Responsive */
@media (max-width: 600px) {
    .logo { font-size: 38px; }
    .coming-soon { font-size: 48px; }
    .tagline { font-size: 18px; }
    .contact-links { gap: 15px; }
    .contact-link { 
        font-size: 16px;
        padding: 12px 24px;
    }
    .contact-box { padding: 24px; }
}
</style>
</head>

<body>

<div class="grid-background"></div>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="container">
    <div class="logo">Groupe Fonga LLC</div>
    
    <div class="coming-soon">Coming Soon</div>
    
    <p class="tagline">Professional services for US Government agencies</p>
    
    <div class="contact-box">
        <div class="contact-title">Get in Touch</div>
        <div class="contact-links">
            <a href="mailto:info@groupefonga.com" class="contact-link">
                <span class="contact-icon">📧</span>
                <span>Email Us</span>
            </a>
            <a href="tel:+15127615585" class="contact-link">
                <span class="contact-icon">📞</span>
                <span>Call Us</span>
            </a>
        </div>
    </div>
</div>

</body>
</html>
